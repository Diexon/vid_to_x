name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ffmpeg_url:
        description: 'Optional URL to a FFmpeg zip to bundle ffmpeg.exe'
        required: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
      - name: Download and prepare FFmpeg for bundling
        run: |
          # Use provided URL or default to a common static build
          if [ -z "${{ github.event.inputs.ffmpeg_url }}" ]; then
            export FFMPEG_URL="https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          else
            export FFMPEG_URL="${{ github.event.inputs.ffmpeg_url }}"
          fi
          echo "Downloading FFmpeg from $FFMPEG_URL"
          curl -L -o ffmpeg.zip "$FFMPEG_URL"
          powershell -Command "Add-Type -AssemblyName System.IO.Compression.FileSystem; [System.IO.Compression.ZipFile]::ExtractToDirectory('ffmpeg.zip','ffmpeg_tmp')"
          powershell -Command "Get-ChildItem -Path ffmpeg_tmp -Filter ffmpeg.exe -Recurse | Select -First 1 | ForEach-Object { Write-Host $_.FullName > ffmpeg_path.txt }"
      - name: Build exe (bundled ffmpeg)
        run: |
          FFMPEG_PATH=$(cat ffmpeg_path.txt)
          echo "Using FFmpeg from: $FFMPEG_PATH"
          py -3 -m PyInstaller --onefile --add-binary "$FFMPEG_PATH;." --name mp4_to_mp3 mp4_to_mp3.py --noconfirm
      - name: Create GitHub Release and Upload Artifacts
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          files: |
            dist/mp4_to_mp3.exe
